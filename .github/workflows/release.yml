# Exports the Godot remake for Windows, macOS and Linux (all from one Linux runner: Godot cross-exports C#, and
# signs the macOS app ad hoc with its built-in signer) and packs each with HOW_TO_PLAY.txt (remake/dist).
# A new tag (v0.1, ...), pushed or made with a release on GitHub's web page, attaches the three packages to that
# tag's Release (creating a normal release if there is none -- never a pre-release: every tag cut here is a
# release); "Run workflow" by hand only
# keeps them as workflow artifacts (they need a GitHub login to download). No package has original game data: the
# game asks the player for their own copy on first run.
# A tag whose tree holds no dev log post naming it fails the run before anything is built (the dev log guard).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The release notes say the technical write-up for this release is in the dev log (docs/_posts, newest
      # first). Enforce it before anything is built or published. The checkout above is the tagged commit itself
      # ($GITHUB_SHA -- not master, so a post merged after the tag cannot paper over it), and some post in it
      # must name the tag. Hard gate, tag path only, no override: the entry merges before the tag is cut
      # ("publish the entry first, then add the link"); a tag cut before its entry merges fails here and a
      # re-run cannot pass, because the tagged tree is immutable -- the recovery is a new tag on a commit that
      # carries the entry. This check proves the post is in the repo at the tag; it does not prove the devlog
      # permalink answers 200, which depends on the Pages deploy and would flake a curl here.
      - name: Require a dev log entry for the tag
        if: github.ref_type == 'tag'
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::the dev log guard must run on the tagged tree; checkout is at $head, not $GITHUB_SHA"
            exit 1
          fi
          tag=$GITHUB_REF_NAME
          newest=$(ls docs/_posts/*.md 2>/dev/null | sed 's|.*/||' | sort | tail -n 1)
          if grep -qF "$tag" docs/_posts/*.md 2>/dev/null; then
            echo "dev log entry for $tag is in the tagged tree"
          else
            if [ -n "$newest" ]; then
              echo "::error::no dev log entry for tag $tag: no post in docs/_posts/ at the tagged commit names '$tag' (newest post $newest)"
            else
              echo "::error::no dev log entry for tag $tag: docs/_posts/ holds no posts at the tagged commit"
            fi
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('remake/**/*.csproj', 'remake/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The editor and the export templates (about 1 GB) only change with GODOT_VERSION.
      - uses: actions/cache@v6
        id: godot
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Download Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="build-${GITHUB_SHA::7}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The clean asset pack (art, fonts, text, sounds, music made new: remake/game/assets/clean/src) is built from its
      # sources here, so every package carries it and plays with no original files. build.py fails if anything is missing.
      - name: Build the clean asset pack
        run: python tools/clean_pack/build.py

      # The runner has no original game files: start the game on the clean pack under a virtual screen and save a
      # few screens (kept as the "clean-screens" artifact). A crash or a missing resource fails the run.
      - name: Play on the clean pack
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          "$godot" --headless --path remake/game --import
          dotnet build remake/game/OpenSimAnt.csproj
          mkdir -p shots
          play() {
            name=$1; shift
            xvfb-run -a -s "-screen 0 1280x1024x24" "$godot" --path remake/game --rendering-driver opengl3 \
              --audio-driver Dummy -- --clean "$@" --screenshot="$PWD/shots/$name.png" 2>&1 | tee "shots/$name.log"
            test -s "shots/$name.png"
            if grep -E "Unhandled exception|[A-Za-z.]*Exception:| is missing" "shots/$name.log"; then
              echo "::error::$name: the game failed on the clean pack"; exit 1
            fi
          }
          play title --title --frames=120
          play game --seed=1234 --ticks=600
          play yard --seed=1234 --ticks=300 --yard
          play history --seed=1234 --ticks=600 --history
          play antipedia --antipedia
          play tutorial --tutorial=5

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clean-screens
          path: shots
          retention-days: 30

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          mkdir -p remake/build/export/windows remake/build/export/linux remake/build/export/macos
          "$godot" --headless --path remake/game --import
          "$godot" --headless --path remake/game --export-release "Windows Desktop" ../build/export/windows/OpenSimAnt.exe
          "$godot" --headless --path remake/game --export-release "Linux" ../build/export/linux/OpenSimAnt.x86_64
          "$godot" --headless --path remake/game --export-release "macOS" ../build/export/macos/OpenSimAnt.zip
          test -f remake/build/export/windows/OpenSimAnt.exe
          test -f remake/build/export/linux/OpenSimAnt.x86_64
          test -f remake/build/export/macos/OpenSimAnt.zip

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docs="remake/dist/HOW_TO_PLAY.txt remake/dist/THIRD_PARTY_NOTICES.txt LICENSE LICENSE-ASSETS"
          mkdir -p dist
          # Windows: a zip of the OpenSimAnt folder
          mkdir -p stage/windows/OpenSimAnt
          cp -r remake/build/export/windows/. stage/windows/OpenSimAnt/
          cp $docs stage/windows/OpenSimAnt/
          (cd stage/windows && zip -qr "../../dist/OpenSimAnt-${VERSION}-windows.zip" OpenSimAnt)
          # macOS: the signed OpenSimAnt.app (unzipped with its permissions and links, packed again with --symlinks)
          mkdir -p stage/macos/OpenSimAnt
          unzip -q remake/build/export/macos/OpenSimAnt.zip -d stage/macos/OpenSimAnt
          cp $docs stage/macos/OpenSimAnt/
          (cd stage/macos && zip -qry "../../dist/OpenSimAnt-${VERSION}-macos.zip" OpenSimAnt)
          # Linux: a tarball, so the executable bit survives
          mkdir -p stage/linux/OpenSimAnt
          cp -r remake/build/export/linux/. stage/linux/OpenSimAnt/
          cp $docs stage/linux/OpenSimAnt/
          chmod +x stage/linux/OpenSimAnt/OpenSimAnt.x86_64
          tar -C stage/linux -czf "dist/OpenSimAnt-${VERSION}-linux.tar.gz" OpenSimAnt
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: OpenSimAnt-${{ steps.version.outputs.version }}-windows
          path: dist/OpenSimAnt-${{ steps.version.outputs.version }}-windows.zip
          retention-days: 30

      - uses: actions/upload-artifact@v6
        with:
          name: OpenSimAnt-${{ steps.version.outputs.version }}-macos
          path: dist/OpenSimAnt-${{ steps.version.outputs.version }}-macos.zip
          retention-days: 30

      - uses: actions/upload-artifact@v6
        with:
          name: OpenSimAnt-${{ steps.version.outputs.version }}-linux
          path: dist/OpenSimAnt-${{ steps.version.outputs.version }}-linux.tar.gz
          retention-days: 30

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the repository's template, not text typed here, so the licence split and the
          # disclaimer cannot be dropped from a release by accident: docs/RELEASE_NOTES_TEMPLATE.md.
          cp docs/RELEASE_NOTES_TEMPLATE.md notes.md
          files="dist/OpenSimAnt-${GITHUB_REF_NAME}-windows.zip dist/OpenSimAnt-${GITHUB_REF_NAME}-macos.zip dist/OpenSimAnt-${GITHUB_REF_NAME}-linux.tar.gz"
          # A release made on GitHub's web page creates the tag (and so starts this run) itself: add the files to it,
          # and set the notes too, or that release keeps whatever the web page gave it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "OpenSimAnt $GITHUB_REF_NAME" --notes-file notes.md
          fi
