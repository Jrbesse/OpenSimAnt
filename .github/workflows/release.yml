# Exports the Godot remake for Windows and zips it with HOW_TO_PLAY.txt (remake/dist). A pushed tag (v0.1, ...)
# attaches the zip to a GitHub Release (a pre-release: these are test builds); "Run workflow" by hand only
# keeps it as a workflow artifact (needs a GitHub login to download). The zip has no original game data:
# the game asks the player for their own copy on first run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('remake/**/*.csproj', 'remake/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The editor and the export templates (about 1 GB) only change with GODOT_VERSION.
      - uses: actions/cache@v6
        id: godot
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Download Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          mkdir -p remake/build/export/windows
          "$godot" --headless --path remake/game --import
          "$godot" --headless --path remake/game --export-release "Windows Desktop" ../build/export/windows/Formica.exe
          test -f remake/build/export/windows/Formica.exe

      - name: Zip
        id: zip
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="build-${GITHUB_SHA::7}"; fi
          name="Formica-${version}-windows"
          mkdir -p dist/Formica
          cp -r remake/build/export/windows/. dist/Formica/
          cp remake/dist/HOW_TO_PLAY.txt dist/Formica/
          (cd dist && zip -qr "$name.zip" Formica)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}.zip
          retention-days: 30

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          A test build of the remake for Windows 10 / 11 (64-bit).

          1. Download **Formica-...-windows.zip** below, right-click it and choose **Extract All...**.
          2. Open the extracted folder and double-click **Formica.exe**. If Windows says "Windows protected
             your PC", click **More info**, then **Run anyway** (the build isn't signed).
          3. The first time, click **Find my game folder...** and pick the folder from your own copy of the
             original DOS game (the one with SIMANT.EXE in it).

          HOW_TO_PLAY.txt in the zip has the details. No original game data is included.
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.zip.outputs.name }}.zip" \
            --title "Formica $GITHUB_REF_NAME (test build)" --notes-file notes.md --prerelease
